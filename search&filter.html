<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Directory</title>
    <style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #12100E,#FCD0A1);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CONTAINER */
.container {
    background:#FFFFC7;
    padding: 25px;
    border-radius: 12px;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* TITLE */
.container h2 {
    text-align: center;
}

.subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: gray;
    margin-bottom: 15px;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* USERS LIST */
#users {
    margin-top: 15px;
}

/* USER CARD */
#users div {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: 0.2s;
}

/* HOVER EFFECT */
#users div:hover {
    background: #e9e9e9;
    transform: translateY(-2px);
}

/* NAME */
#users strong {
    font-size: 1rem;
}

/* EMAIL + CITY */
#users p {
    font-size: 0.9rem;
    color: #333;
}

/* LINE */
hr {
    margin-top: 8px;
    border: none;
    height: 1px;
    background: #ddd;
}

    </style>
</head>
<body>
<div class="container">
    <h2>User Directory</h2>
<p class="subtitle">search, sort and filter users</p>
    <!-- Search -->
    <input type="text" id="search" placeholder="Search by name or email">

    <!-- Sort -->
    <select id="sort">
        <option value="az">Sort A-Z</option>
        <option value="za">Sort Z-A</option>
    </select>

    <!-- Filter -->
    <select id="cityFilter">
        <option value="all">All Cities</option>
    </select>

    <!-- Display -->
    <div id="users"></div>
</div>
    <script>

let allUsers = [];

// Fetch users
async function fetchUsers() {
    const response = await fetch("https://jsonplaceholder.typicode.com/users");
    return await response.json();
}

// Display users
function displayUsers(users) {
    const container = document.getElementById("users");
    container.innerHTML = "";

    users.forEach(user => {
        const div = document.createElement("div");
        div.innerHTML = `
            <p><strong>${user.name}</strong></p>
            <p>${user.email}</p>
            <p>${user.address.city}</p>
            <hr>
        `;
        container.appendChild(div);
    });
}

// Populate cities
function populateCities(users) {
    const cityFilter = document.getElementById("cityFilter");

    const cities = [...new Set(users.map(user => user.address.city))];

    cities.forEach(city => {
        const option = document.createElement("option");
        option.value = city;
        option.textContent = city;
        cityFilter.appendChild(option);
    });
}

// Apply ALL filters together
function applyFilters() {
    const query = document.getElementById("search").value.toLowerCase();
    const sortValue = document.getElementById("sort").value;
    const cityValue = document.getElementById("cityFilter").value;

    let result = [...allUsers];

    // Search
    result = result.filter(user =>
        user.name.toLowerCase().includes(query) ||
        user.email.toLowerCase().includes(query)
    );

    // City filter
    if (cityValue !== "all") {
        result = result.filter(user => user.address.city === cityValue);
    }

    // Sort
    if (sortValue === "az") {
        result.sort((a, b) => a.name.localeCompare(b.name));
    } else {
        result.sort((a, b) => b.name.localeCompare(a.name));
    }

    displayUsers(result);
}

// Init app
async function init() {
    allUsers = await fetchUsers();
    displayUsers(allUsers);
    populateCities(allUsers);

    // Event listeners
    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("sort").addEventListener("change", applyFilters);
    document.getElementById("cityFilter").addEventListener("change", applyFilters);
}

init();

    </script>
</body>
</html>
