<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creat post</title>
</head>
<body>
    <h2>Creat New Post</h2>
    <form id="postForm">
<input type="text" id="title"  placeholder="Title" required><br><br>

<textarea id="body" placeholder="Content" required></textarea><br><br>
 <input type="number" id="userId" placeholder="=User ID" required><br><br>  
<button type="submit">Create Post</button>
</form>
<h3>Result</h3>
<div id="result"></div>
<script>

 async function creatPost(tittle, body, userId){
    const response = await fetch("https://jsonplaceholder.typicode.com/posts",{
        method: "POST",
    header: {
        "Content-type": "application/json"
    },
    body: JSON.stringify({
        title,
        body,
        userId
    })
    });
    if(!response.ok){
        throw new error("failed to creat post");
    } 
    return response.json
}
const Form =document.getElementById("postForm");
const resultDiv =document.getElementById("results")
postForm.addEventListener("submit",async (e)=>{
    e.preventDefault();

    const title = document.getElementById("title").value;
    const body = document.getElementById("body").value;
    const userId = document.getElementById("userId").value;
    try{
        const newPost =await creatPost(title, body,userId);
    resultDiv.innerHTML=`
    <p><strong>Post Created</strong></p>
    <p> ID: ${newPost.id}</p>
    <p>Title: ${newPost.title}</p>
    <p>${newPost.body}</p>`;
}catch(error){
    const message = error.message || error;
    resultDiv.textContent = "Error:" + error.message
} 
}); 
</script>
</body>
</html>
